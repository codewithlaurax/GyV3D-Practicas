<!DOCTYPE html>
<html>

<head>
    <title>Ejercicio 4. Transformaciones con WebGL</title>
</head>

<body onload="init()">     
    <canvas id="myCanvas" width="640" height="480"></canvas>     
    <br>     
    Step: <input type="text" value="0.01" id="step"> 
</body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/3.4.2/gl-matrix-min.js"></script>

<script id="shaderVs" type="x-shader/x-vertex">
    attribute vec4 a_Position;  // Atributo de posición del vértice
    uniform mat4 u_Matrix;      // Matriz de transformación
    void main() {
        gl_Position = u_Matrix * a_Position;
    }
</script>

<script id="shaderFs" type="x-shader/x-fragment">
    precision mediump float;
    uniform vec4 u_FragColor;
    void main() {
        gl_FragColor = u_FragColor;
    }
</script>

<script>
    // Variables para crear una matriz por cada parte de la figura
    var globalMatrix, tejadoMatrix, izquierdaMatrix, derechaMatrix;

    function init() {
        // Get canvas object from the DOM
        var canvas = document.getElementById("myCanvas");

        // Init WebGL context
        var gl = canvas.getContext("webgl");
        if (!gl) {
            console.log("Failed to get the rendering context for WebGL");
            return;
        }

        // Init shaders
        var vs = document.getElementById('shaderVs').innerHTML;
        var fs = document.getElementById('shaderFs').innerHTML;
        if (!initShaders(gl, vs, fs)) {
            console.log('Failed to intialize shaders.');
            return;
        }

        // Write the positions of vertices to a vertex shader
        var n = initVertexBuffers(gl);
        if (n < 0) {
            console.log('Failed to set the positions of the vertices');
            return;
        }

        // Clear canvas
        gl.clearColor(0.0, 0.0, 1.0, 1.0);
        
        // Initialize matrices
        globalMatrix = glMatrix.mat4.create();
        tejadoMatrix = glMatrix.mat4.create();
        izquierdaMatrix = glMatrix.mat4.create();
        derechaMatrix = glMatrix.mat4.create();

        // Draw Scene
        drawScene(gl, n);
        
        // Register event handler
        document.onkeydown = function (ev) {
            handleKeys(ev, gl, n);
        };
    }

    // Función que multiplica las matrices, para reutilizar la cadena de transformaciones en la medida de lo posible
    function multiplyMatrix(mat1, mat2) {
        var result = glMatrix.mat4.create();
        glMatrix.mat4.multiply(result, mat1, mat2);
        return result;
    }

    /*
     * This function handles key presses and performs the corresponding transformations
     * @param {KeyboardEvent} ev 
     * @param {WebGLRenderingContext} gl 
     * @param {vertex number} n 
     */
    function handleKeys(ev, gl, n) {
        var step = new Number(document.getElementById("step").value);
        var position = Math.sin(step);
        var scale = Math.abs(Math.sin(step));   // Lo usamos para que si el número es negativo no gire
        var matrix;
        
        switch (ev.key) {
            case "ArrowLeft": // Left
                matrix = glMatrix.mat4.fromTranslation(glMatrix.mat4.create(), [-position, 0.0, 0.0]);       
                globalMatrix = multiplyMatrix(matrix, globalMatrix);
                break;
            case "ArrowRight": // Right
                matrix = glMatrix.mat4.fromTranslation(glMatrix.mat4.create(), [position, 0.0, 0.0]);
                globalMatrix = multiplyMatrix(matrix, globalMatrix);
                break;
            case "ArrowUp": // Up
                matrix = glMatrix.mat4.fromTranslation(glMatrix.mat4.create(), [0.0, position, 0.0]);
                globalMatrix = multiplyMatrix(matrix, globalMatrix);
                break;
            case "ArrowDown": // Down
                matrix = glMatrix.mat4.fromTranslation(glMatrix.mat4.create(), [0.0, -position, 0.0]);
                globalMatrix = multiplyMatrix(matrix, globalMatrix);
                break;
            case "PageUp": // PageUp -- Aumento de escala (el arco se hace más grande)
                matrix = glMatrix.mat4.fromScaling(glMatrix.mat4.create(), [1/scale, 1/scale, 0.0]);
                globalMatrix = multiplyMatrix(matrix, globalMatrix);
                break;
            case "PageDown": // PageDown -- Contracción de escala (el arco se hace más pequeño)
                matrix = glMatrix.mat4.fromScaling(glMatrix.mat4.create(), [scale, scale, 0.0]);
                globalMatrix = multiplyMatrix(matrix, globalMatrix);
                break;
            case "w": // w
                matrix = glMatrix.mat4.fromTranslation(glMatrix.mat4.create(), [0.0, position, 0.0]);
                tejadoMatrix = multiplyMatrix(matrix, tejadoMatrix);
                break;
            case "a": // a
                matrix = glMatrix.mat4.fromTranslation(glMatrix.mat4.create(), [-position, 0.0, 0.0]);
                tejadoMatrix = multiplyMatrix(matrix, tejadoMatrix);
                break;
            case "s": // s
                matrix = glMatrix.mat4.fromTranslation(glMatrix.mat4.create(), [0.0, -position, 0.0]);
                tejadoMatrix = multiplyMatrix(matrix, tejadoMatrix);
                break;
            case "d": // d
                matrix = glMatrix.mat4.fromTranslation(glMatrix.mat4.create(), [position, 0.0, 0.0]);
                tejadoMatrix = multiplyMatrix(matrix, tejadoMatrix);
                break;
            case "z": // z                        
                matrix = glMatrix.mat4.fromYRotation(glMatrix.mat4.create(), position);
                tejadoMatrix = multiplyMatrix(matrix, tejadoMatrix);
                break;
            case "x": // x
                matrix = glMatrix.mat4.fromZRotation(glMatrix.mat4.create(), -position);
                izquierdaMatrix = multiplyMatrix(matrix, izquierdaMatrix);
                break;
            case "c": // c
                matrix = glMatrix.mat4.fromZRotation(glMatrix.mat4.create(), position);
                derechaMatrix = multiplyMatrix(matrix, derechaMatrix);
                break;  
        }

        // Call drawScene again in the next browser repaint
        requestAnimationFrame(function() {
            drawScene(gl, n);
        });
    }

    /*
     * This function is used to draw the scene
     * @param {WebGLRenderingContext} gl 
     * @param {vertex number} n 
     */
    function drawScene(gl, n) {
        // Clear canvas
        gl.clear(gl.COLOR_BUFFER_BIT);

        // Obtenemos la variable u_Matrix del shader
        var mvMatrixUniform = gl.getUniformLocation(gl.program, "u_Matrix");

        // Draw Tejado
        var tejadoMatrixCopy = multiplyMatrix(multiplyMatrix(glMatrix.mat4.clone(tejadoMatrix), globalMatrix), tejadoMatrix);
        gl.uniformMatrix4fv(mvMatrixUniform, false, tejadoMatrixCopy);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        // Draw Columna Izquierda
        var izquierdaMatrixCopy = multiplyMatrix(multiplyMatrix(glMatrix.mat4.clone(izquierdaMatrix), globalMatrix), izquierdaMatrix);
        gl.uniformMatrix4fv(mvMatrixUniform, false, izquierdaMatrixCopy);
        gl.drawArrays(gl.TRIANGLES, 3, 6);

        // Draw Columna Derecha
        var derechaMatrixCopy = multiplyMatrix(multiplyMatrix(glMatrix.mat4.clone(derechaMatrix), globalMatrix), derechaMatrix);
        gl.uniformMatrix4fv(mvMatrixUniform, false, derechaMatrixCopy);
        gl.drawArrays(gl.TRIANGLES, 9, 6);
    }

    /*
     * This function is used to initialize the vertex buffers
     * @param {WebGLRenderingContext} gl  
     * @returns {number} number of vertices
     */
     function initVertexBuffers(gl) {
        // Vertices
        var dim = 3;

        var vertices = new Float32Array([
            // Tejado
            0.0, 0.5, 0.0,
            -0.70, 0.0, 0.0,
            0.70, 0.0, 0.0,

            // Columna Izquierda
            -0.55, -0.75, 0.0,
            -0.55, 0.0, 0.0,
            -0.25, -0.75, 0.0,
            -0.55, 0.0, 0.0,
            -0.25, 0.0, 0.0,
            -0.25, -0.75, 0.0,

            // Columna Derecha
            0.25, -0.75, 0.0,
            0.25, 0.0, 0.0,
            0.55, -0.75, 0.0,
            0.25, 0.0, 0.0,
            0.55, 0.0, 0.0,
            0.55, -0.75, 0.0
        ]);

        // Fragment color
        var rgba = [1.0, 1, 0.0, 1.0];

        // Create a buffer object
        var vertexBuffer = gl.createBuffer();
        if (!vertexBuffer) {
            console.log('Failed to create the buffer object');
            return -1;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

        // Assign the vertices in buffer object to a_Position variable
        var a_Position = gl.getAttribLocation(gl.program, 'a_Position');
        if (a_Position < 0) {
            console.log('Failed to get the storage location of a_Position');
            return -1;
        }
        gl.vertexAttribPointer(a_Position, dim, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(a_Position);

        // Assign the color to u_FragColor variable
        var u_FragColor = gl.getUniformLocation(gl.program, 'u_FragColor');
        if (u_FragColor < 0) {
            console.log('Failed to get the storage location of u_FragColor');
            return -1;
        }
        gl.uniform4fv(u_FragColor, rgba);

        // Return number of vertices
        return vertices.length / dim;
    }

    /*
     * This function is used to initialize the shaders
     * @param {WebGLRenderingContext} gl 
     * @param {String} vs_source 
     * @param {String} fs_source 
     * @returns {Boolean}
     */
    function initShaders(gl, vs_source, fs_source) {
        // Compile shaders
        var vertexShader = makeShader(gl, vs_source, gl.VERTEX_SHADER);
        var fragmentShader = makeShader(gl, fs_source, gl.FRAGMENT_SHADER);

        // Create program
        var glProgram = gl.createProgram();

        // Attach and link shaders to the program
        gl.attachShader(glProgram, vertexShader);
        gl.attachShader(glProgram, fragmentShader);
        gl.linkProgram(glProgram);
        if (!gl.getProgramParameter(glProgram, gl.LINK_STATUS)) {
            alert("Unable to initialize the shader program");
            return false;
        }

        // Use program
        gl.useProgram(glProgram);
        gl.program = glProgram;

        return true;
    }

    /*
     * This function is used to create a shader
     * @param {WebGLRenderingContext} gl 
     * @param {String} src 
     * @param {Number} type 
     * @returns {WebGLShader}
     */
    function makeShader(gl, src, type) {
        var shader = gl.createShader(type);
        gl.shaderSource(shader, src);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            alert("Error compiling shader: " + gl.getShaderInfoLog(shader));
            return;
        }
        return shader;
    }

</script>

</html>
